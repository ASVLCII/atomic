                      - cell "Resolve conflicts before launching downstream stages" [ref=e5405]
              - generic [ref=e5406]:
                - text: Use compaction, file references, and bounded loops before context fills. Attached stage chat shows
                - code [ref=e5407]: Compacting context...
                - text: ","
                - code [ref=e5408]: Auto-compacting...
                - text: ", or"
                - code [ref=e5409]: Context overflow detected. Auto-compacting...
                - text: as appropriate. The label survives detaching and reattaching and clears when compaction ends. Successful compaction leaves an expandable
                - code [ref=e5410]: ✻ Context compacted
                - text: transcript boundary.
              - heading "Navigate to header Compression and Artifact Handoffs" [level=3] [ref=e5411]:
                - link "Navigate to header" [ref=e5412] [cursor=pointer]:
                  - /url: "#compression-and-artifact-handoffs"
                  - img [ref=e5414]
                - generic [ref=e5417] [cursor=pointer]: Compression and Artifact Handoffs
              - generic [ref=e5418]: Optimize for tokens per completed task, not the smallest prompt. Aggressive compression can force later stages to rediscover information.
              - generic [ref=e5419]: "A compressed handoff includes:"
              - list [ref=e5420]:
                - listitem [ref=e5421]: objective and current status
                - listitem [ref=e5422]: decisions already made
                - listitem [ref=e5423]: files, symbols, commands, and artifact paths with evidence
                - listitem [ref=e5424]: open questions and known risks
                - listitem [ref=e5425]: rejected alternatives when they matter
                - listitem [ref=e5426]: next action expected from the downstream stage
              - generic [ref=e5427]:
                - text: Pass file references, not content. This is the strongly encouraged default for every handoff — between stages and back to the caller — and it is what keeps a multi-stage run affordable. Use
                - code [ref=e5428]: output
                - text: with
                - code [ref=e5429]: "outputMode: \"file-only\""
                - text: and
                - code [ref=e5430]: reads
                - text: for research bundles, logs, plans, diffs, reviewer reports, and any other stage product that can grow. In the downstream stage prompt, say
                - code [ref=e5431]: "Read the file at ${artifactPath} before continuing."
                - text: Do not inject full session tails, all previous stage outputs, or every prior review round into later prompts by default; pass the latest relevant artifact paths and make older history discoverable from a ledger or index file.
              - generic [ref=e5432]: "Three rules make that work in practice:"
              - list [ref=e5433]:
                - listitem [ref=e5434]:
                  - strong [ref=e5435]: One owner per artifact.
                  - text: The runner writes the stage’s completed answer to
                  - code [ref=e5436]: output
                  - text: and appends later completed answers from the same generation as numbered supplements. This preserves a report when an admitted clarification arrives before generation close, without copying tool progress or earlier history into the artifact. Completed handoffs are immutable under later chat. State corrections explicitly, and use a new tracked stage and output path for an intentional replacement. The runner also writes the companion transcript outside the repository and tells the model the output contract. Describe the deliverable in your prompt, not the plumbing. Search the transcript with
                  - code [ref=e5437]: rg
                  - text: for supporting details that belong outside the curated artifact.
                - listitem [ref=e5438]:
                  - strong [ref=e5439]: Do not read an artifact back just to return it.
                  - code [ref=e5440]: "outputMode: \"file-only\""
                  - text: exists so the parent receives a compact reference. Calling
                  - code [ref=e5441]: readFile
                  - text: on that artifact and returning its text as a workflow output cancels the saving and drops the whole report into the caller’s context window. Return the reference and a
                  - code [ref=e5442]: "*_path"
                  - text: output instead.
                - listitem [ref=e5443]:
                  - strong [ref=e5444]: Return paths from the workflow.
                  - text: Declared outputs are consumed by the calling session, so a workflow’s
                  - code [ref=e5445]: result
                  - text: should be a reference plus explicit
                  - code [ref=e5446]: "*_path"
                  - text: outputs. Callers that need the body read the path; callers that only need the outcome pay nothing for it. When a detail is missing from the curated artifact, search its companion transcript with
                  - code [ref=e5447]: rg
                  - text: and inspect a narrow range.
              - generic [ref=e5448]:
                - text: Substantial handoffs should travel through files or durable artifacts instead of hidden transcript assumptions. This keeps stage prompts small, makes review/audit possible, and lets later stages reread the authoritative material without depending on what a previous model summarized. Remember that
                - code [ref=e5449]: reads
                - text: "passes paths rather than content: a stage reads the file when it runs, so the artifact must hold the real report at that moment."
              - generic [ref=e5450]:
                - generic [ref=e5452]:
                  - button "Copy the contents from the code block" [ref=e5453] [cursor=pointer]:
                    - img [ref=e5454]
                  - status [ref=e5457]
