              - heading "Navigate to header Multi-Agent and Parallel Patterns" [level=3] [ref=e5475]:
                - link "Navigate to header" [ref=e5476] [cursor=pointer]:
                  - /url: "#multi-agent-and-parallel-patterns"
                  - img [ref=e5478]
                - generic [ref=e5481] [cursor=pointer]: Multi-Agent and Parallel Patterns
              - generic [ref=e5482]: "Use parallel stages to isolate context and separate independent work, not merely to assign role labels. Good parallel branches have distinct evidence-gathering or review angles:"
              - list [ref=e5483]:
                - listitem [ref=e5484]: "locator / mapper: where relevant files and systems live"
                - listitem [ref=e5485]: "analyzer: how the current implementation works"
                - listitem [ref=e5486]: "pattern finder: how similar code is written elsewhere"
                - listitem [ref=e5487]: "external researcher: what upstream docs or APIs require"
                - listitem [ref=e5488]: "reviewer/evaluator: whether outputs satisfy the validation contract"
              - generic [ref=e5489]: Have the parent workflow synthesize results rather than letting branches silently make conflicting decisions. If branches must agree, design an explicit consensus or adjudication stage.
              - heading "Navigate to header Filesystem Context" [level=3] [ref=e5490]:
