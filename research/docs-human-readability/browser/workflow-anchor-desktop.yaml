              - generic [ref=e6281]: "Best practices:"
              - list [ref=e6282]:
                - listitem [ref=e6283]: Give verifiers fresh context and a concrete rubric with pass/fail evidence requirements. For task-specific contract risk, use a grumpy/skeptical-but-fair persona that seeks realistic counterexamples, stays within the literal objective, rejects hand-waving and circular worker-authored evidence, and reports only actionable evidence-backed defects.
                - listitem [ref=e6284]:
                  - text: Separate adversarial probe design from authoritative execution. Require a structured verifier plan with each exact probe, inputs, command/assertion, expected success condition, and covered requirement/risk; then run selected compile, test, schema generation/validation, runtime, or artifact checks through durable workflow-owned
                  - code [ref=e6285]: ctx.tool(...)
                  - text: calls. Actual tool results—not model self-report—feed judgment and consolidated repair.
                - listitem [ref=e6286]:
                  - text: Known contracts may use direct task-specific
                  - code [ref=e6287]: ctx.tool(...)
                  - text: gates designed before launch; uncertain risks may use model-selected probes executed by those deterministic tools. Rerun the tools after repair until the declared pass condition or iteration limit.
                - listitem [ref=e6288]:
                  - text: Ask verifiers to find blockers and not rewrite the candidate unless you explicitly assign them to repair it. Keep pure transformations as ordinary TypeScript rather than wrapping every model-stage action in
                  - code [ref=e6289]: ctx.tool
                  - text: .
                - listitem [ref=e6290]:
                  - text: Split the rubric into named criteria and score them separately. Combine scores with an explicit veto for disqualifying findings rather than requiring every verifier to approve. See
                  - link "Verification scaling" [ref=e6291] [cursor=pointer]:
                    - /url: "#verification-scaling"
                  - text: for cost trade-offs.
                - listitem [ref=e6292]:
                  - text: The shipped
                  - code [ref=e6293]: adversarial-verification
                  - text: builtin accepts
                  - code [ref=e6294]: criteria
                  - text: as a record of criterion names to descriptions or as a
