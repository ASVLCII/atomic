                  - generic [ref=e5464]: "task: \"Map the subsystem and return the complete report as your final message.\","
                  - generic [ref=e5465]: "output: researchPath,"
                  - generic [ref=e5466]: "outputMode: \"file-only\","
                  - generic [ref=e5467]: "});"
                  - generic [ref=e5468]: "const review = await ctx.task(\"reviewer\", {"
                  - generic [ref=e5469]: "task: ["
                  - generic [ref=e5470]: "`Research artifact: ${researchPath}`,"
                  - generic [ref=e5471]: "`Read the file at ${researchPath} incrementally and inspect only the sections needed for this review.`,"
                  - generic [ref=e5472]: "].join(\"\\n\"),"
