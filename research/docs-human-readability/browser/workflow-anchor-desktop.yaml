              - generic [ref=e5266]:
                - text: "Stages select faster inference the same way they select any other model: by naming it. Where a provider publishes a fast variant, its canonical selectable ID is the base model ID plus"
                - code [ref=e5267]: "-fast"
                - text: ", so a stage pins"
                - code [ref=e5268]: openai-codex/gpt-5.6-sol-fast
                - text: — with an optional thinking suffix,
                - code [ref=e5269]: openai-codex/gpt-5.6-sol-fast:medium
                - text: — in its
                - code [ref=e5270]: model
                - text: "field, and lists fast and normal IDs in its fallback model fields in whatever order it wants:"
              - generic [ref=e5271]:
                - generic [ref=e5273]:
