                - listitem [ref=e5526]: for review loops, pass the latest review-round artifact first and let a ledger/index point to older rounds only when needed
                - listitem [ref=e5527]: give parallel branches separate output paths to avoid write conflicts
                - listitem [ref=e5528]:
                  - text: use
