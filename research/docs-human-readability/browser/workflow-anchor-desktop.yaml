                      - cell "A manual prototype works on representative inputs" [ref=e5590]
                      - cell "The model lacks required context and cannot retrieve it" [ref=e5591]
              - generic [ref=e5592]: "For complex workflows, structure the implementation as a pipeline: acquire context, prepare prompts/artifacts, process with LLM stages, parse or validate outputs, and render the final result."
              - heading "Navigate to header Design Checklist" [level=2] [ref=e5593]:
                - link "Navigate to header" [ref=e5594] [cursor=pointer]:
                  - /url: "#design-checklist"
                  - img [ref=e5596]
                - generic [ref=e5599] [cursor=pointer]: Design Checklist
              - generic [ref=e5600]: "Before implementing or shipping a non-trivial workflow, answer these questions:"
              - list [ref=e5601]:
                - listitem [ref=e5602]:
                  - strong [ref=e5603]: "Purpose and fit:"
                  - text: What concrete outcome should the workflow produce? Is the task naturally multi-stage, parallel, resumable, or reusable? What is out of scope?
                - listitem [ref=e5604]:
                  - strong [ref=e5605]: "Inputs:"
                  - text: Which values should be declared as inputs? What is the narrowest schema type? Which defaults are safe?
                - listitem [ref=e5606]:
                  - strong [ref=e5607]: "Common pattern:"
                  - text: Which
                  - link "common workflow pattern" [ref=e5608] [cursor=pointer]:
                    - /url: "#common-workflow-patterns"
                  - text: best matches the task, and where does the actual design intentionally diverge?
                - listitem [ref=e5609]:
                  - strong [ref=e5610]: "Stage decomposition:"
                  - text: For each stage, what question does it answer, what context does it need, what output should it return, and what model/tool/MCP requirements does it have?
                - listitem [ref=e5611]:
                  - strong [ref=e5612]: "Local stage contract:"
                  - text: Can this stage prompt stand alone with its current objective, inputs/artifacts, expected outputs, tools/checks, and success criteria, without unexplained workflow internals or future-stage assumptions?
                - listitem [ref=e5613]:
                  - strong [ref=e5614]: "Prompt vocabulary:"
                  - text: Do stage, reviewer, and reducer prompts describe the concrete action, available evidence, and success criteria that the stage can see locally, instead of assuming the model knows the workflow graph’s name or surrounding context? Avoid phrasing like “the create-PR workflow stage” or “this Foo workflow” unless that name is explicitly supplied as user-visible context or materially affects behavior.
                - listitem [ref=e5615]:
                  - strong [ref=e5616]: "Information flow:"
                  - text: For every edge between stages, is
                  - code [ref=e5617]: previous
                  - text: enough, or should the handoff use structured returns, files,
                  - code [ref=e5618]: reads
                  - text: ","
                  - code [ref=e5619]: output
                  - text: ", or"
                  - code [ref=e5620]: outputMode
                  - text: "?"
                - listitem [ref=e5621]:
                  - strong [ref=e5622]: "Output contract:"
                  - text: Which outputs should be declared in
                  - code [ref=e5623]: outputs
                  - text: ", which stage/task/child results should"
                  - code [ref=e5624]: run
                  - text: return for those keys, and what runtime type must each value have? If another workflow may call this workflow as a child, which non-default outputs should the parent rely on?
                - listitem [ref=e5625]:
                  - strong [ref=e5626]: "Context size:"
                  - text: Can downstream stages succeed from the handoff alone? Should large transcripts, logs, or research bundles be summarized or saved as artifacts?
                - listitem [ref=e5627]:
                  - strong [ref=e5628]: "Control flow:"
                  - text: Should the workflow use
                  - code [ref=e5629]: ctx.chain
                  - text: ","
                  - code [ref=e5630]: ctx.parallel
                  - text: ","
                  - code [ref=e5631]: ctx.ui
                  - text: ", bounded loops,"
                  - code [ref=e5632]: failFast
                  - text: ", or"
                  - code [ref=e5633]: fallbackModels
                  - text: "?"
                - listitem [ref=e5634]:
                  - strong [ref=e5635]: "Acyclic topology:"
                  - text: What node and dependency shape can each branch, bounded loop, and nested workflow boundary materialize? Which stages repeat, does each iteration create distinct tracked work with stable identity and call order, and what is the current frontier before each repeat? Could any proposed parent edge target the node itself or an ancestor? Are nested children composed through
                  - code [ref=e5636]: ctx.workflow(...)
                  - text: boundaries rather than recursive
                  - code [ref=e5637]: run
                  - text: invocation? Redesign or stop before launch if any self-edge or back-edge remains.
                - listitem [ref=e5638]:
                  - strong [ref=e5639]: "Scope control:"
                  - text: Could valid adjacent findings expand the patch? If so, where will a fresh scope guard read the immutable contract, how will it classify and persist bounded decisions, which
                  - code [ref=e5640]: warn
                  - text: /
                  - code [ref=e5641]: block
                  - text: /
                  - code [ref=e5642]: "off"
                  - text: fallback applies, and which worker session owns any forked continuation?
                - listitem [ref=e5643]:
                  - strong [ref=e5644]: "User experience:"
                  - text: Are stage names readable in status and graph views? Is the final output compact? Are important artifacts saved with stable paths?
                - listitem [ref=e5645]:
                  - strong [ref=e5646]: "Validation:"
                  - text: What success criteria, review gates, deterministic checks, or evaluator stages prove the workflow did the right thing? Are model gates schema-backed instead of regex/prose-matched, and do adaptive gates run as focused model stages with explicit tool/check instructions?
                - listitem [ref=e5647]:
                  - strong [ref=e5648]: "Final actions:"
                  - text: Does the workflow distinguish implementation/review convergence from post-approval final actions such as PR/MR/review creation, release tagging, deployment, or publication? Are reviewers and reducers prompted to approve and hand off when implementation and validation criteria are proven and only an explicitly authorized final action remains?
              - generic [ref=e5649]: Good workflows are information-flow systems, not just prompt sequences. Keep stage prompts focused, preserve evidence with file paths or artifacts, and pass only the context each downstream stage needs.
              - heading "Navigate to header Common Mistakes" [level=2] [ref=e5650]:
                - link "Navigate to header" [ref=e5651] [cursor=pointer]:
                  - /url: "#common-mistakes"
                  - img [ref=e5653]
                - generic [ref=e5656] [cursor=pointer]: Common Mistakes
              - list [ref=e5657]:
                - listitem [ref=e5658]: Do not invent workflow names; list first.
                - listitem [ref=e5659]:
                  - text: Do not guess input keys; inspect with
                  - code [ref=e5660]: inputs
                  - text: or
                  - code [ref=e5661]: get
                  - text: first.
                - listitem [ref=e5662]:
                  - text: Do not call
                  - code [ref=e5663]: create
                  - text: ","
                  - code [ref=e5664]: update
                  - text: ", or"
                  - code [ref=e5665]: delete
                  - text: on the workflow tool; definitions are code-authored.
                - listitem [ref=e5666]:
                  - text: Do not use legacy workflow tool fields like
                  - code [ref=e5667]: agent
                  - text: ","
                  - code [ref=e5668]: stage
                  - text: ", or run-control"
                  - code [ref=e5669]: name
                  - text: .
                - listitem [ref=e5670]:
                  - text: Do not pass strings or path objects to
                  - code [ref=e5671]: ctx.workflow(...)
                  - text: ; import the workflow definition from
                  - code [ref=e5672]: "@bastani/atomic/workflows/builtin"
                  - text: or another TypeScript module first.
                - listitem [ref=e5673]: Do not create a self-edge or a dependency edge from the current frontier to an existing ancestor. Cyclic workflow graphs are unsupported; redesign or stop before launch when a cycle cannot be removed.
                - listitem [ref=e5674]: Do not model a bounded loop by reopening an earlier node beneath its downstream work. Create distinct tracked work per iteration and keep retained-session follow-up as non-topological activity when it adds no dependency work.
                - listitem [ref=e5675]: Do not claim TypeScript or workflow discovery proves a dynamic workflow acyclic. Discovery diagnoses imports and definition shape; execution, replay, and DBOS hydration are the runtime topology boundary.
                - listitem [ref=e5676]:
                  - text: Do not rely on undeclared child outputs; returning a key that is not declared in
                  - code [ref=e5677]: outputs
                  - text: fails the run. Declare every child-workflow field you expose in
                  - code [ref=e5678]: outputs
                  - text: — including
                  - code [ref=e5679]: result
                  - text: — and return values matching those schemas from
                  - code [ref=e5680]: run
                  - text: (see
                  - link "Outputs" [ref=e5681] [cursor=pointer]:
                    - /url: /workflows/authoring#outputs
                  - text: ).
                - listitem [ref=e5682]:
                  - text: Do not expect to select or rename child outputs at the call site; parent workflows receive the child’s declared output contract as
                  - code [ref=e5683]: child.outputs
                  - text: after checking
                  - code [ref=e5684]: child.exited === false
                  - text: ", and a partial declared-output map when"
                  - code [ref=e5685]: child.exited === true
                  - text: .
                - listitem [ref=e5686]: Do not expect named workflow runs to block the chat turn; they are background tasks.
                - listitem [ref=e5687]:
                  - text: Use
                  - code [ref=e5688]: pause
                  - text: when the user asks to pause specific live work resumably; use
                  - code [ref=e5689]: quit
                  - text: for a graceful run-level process boundary.
                - listitem [ref=e5690]: Keep stage names readable because they appear in workflow status and UI.
                - listitem [ref=e5691]: Do not ask a stage to reason from workflow or stage names that are only orchestration labels. Model stages see their local prompt, artifacts, tools, and reads; describe the concrete action and evidence instead of referring to an implementation-specific nickname.
                - listitem [ref=e5692]:
                  - text: Do not write stage prompts that depend on hidden workflow-wide awareness; make each model stage locally scoped and self-described (
                  - link "Locally Scoped Stage Prompts" [ref=e5693] [cursor=pointer]:
                    - /url: "#locally-scoped-stage-prompts"
                  - text: ).
                - listitem [ref=e5694]:
                  - text: Do not parse model gate decisions from ad-hoc prose with regular expressions; configure
                  - code [ref=e5695]: schema
                  - text: on a focused workflow item and consume
                  - code [ref=e5696]: result.structured
                  - text: .
                - listitem [ref=e5697]:
                  - text: Do not make reviewers fail an implementation gate solely because an authorized final action has not run yet. Represent that remainder as a post-approval next action (for example
                  - code [ref=e5698]: finalActionRemaining
                  - text: /
                  - code [ref=e5699]: nextAction
                  - text: ) and let the final stage perform it.
                - listitem [ref=e5700]: Do not let scope guards approve correctness or turn follow-up findings into blockers. Keep scope decisions separate from code review and deterministic validation, and do not reject expected pre-publication state assigned to a later lifecycle stage.
                - listitem [ref=e5701]: Return compact structured decisions and save large artifacts to files; artifact handoffs should still use files when the next stage does not need the whole payload in context.
