              - generic [ref=e4266]:
                - strong [ref=e4267]: Workflow run isolation and Git worktree isolation are separate guarantees.
                - text: A top-level run provides its own context, progress, lifecycle controls, retry state, and root failure boundary. A worktree provides a separate checkout and Git state; it is not an operating-system sandbox. Several worktrees inside one sequential root do not create concurrent top-level runs or independent root failure boundaries, while concurrent writer runs without separate worktrees can still conflict. Use both for independent implementation items.
