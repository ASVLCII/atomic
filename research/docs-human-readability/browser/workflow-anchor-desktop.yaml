              - generic [ref=e4219]: "Some requests are not one task but a queue of them: “address all open issues”, “fix every Linear ticket assigned to me”, “burn down the TODO backlog”, or “implement issue A and create a PR after; also implement issue B and create a PR after”. One monolithic worker loop would process the queue serially in a growing context and make unrelated work share one root failure boundary."
              - generic [ref=e4220]:
                - text: Do not confuse splitting a queue across runs with splitting one objective across slices. Queue triage separates unrelated implementation items into top-level lifecycles;
                - link "Stacked implementation slices" [ref=e4221] [cursor=pointer]:
