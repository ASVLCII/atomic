                - generic [ref=e5567] [cursor=pointer]: Task Fit and Project Design
              - generic [ref=e5568]: "Before turning a process into a workflow, confirm that it suits automation:"
              - region "Scrollable table" [ref=e5569]:
                - table [ref=e5571]:
                  - rowgroup [ref=e5572]:
                    - row "Proceed when Avoid or redesign when" [ref=e5573]:
                      - columnheader "Proceed when" [ref=e5574]
                      - columnheader "Avoid or redesign when" [ref=e5575]
