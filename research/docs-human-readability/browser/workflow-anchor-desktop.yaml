                - listitem [ref=e6395]:
                  - text: "When the filter ranks candidates rather than applying a threshold, use the same judge guidance as Tournament: graded per-criterion integer scores rather than binary keep/drop, a Bradley–Terry preference from the score gap so near-ties stay near-ties, and K repeats with candidates swapped between the A and B slots. See"
                  - link "Verification scaling" [ref=e6396] [cursor=pointer]:
                    - /url: "#verification-scaling"
                  - text: .
                - listitem [ref=e6397]:
                  - text: For a custom ranking filter, reuse the shared
                  - code [ref=e6398]: verification-criteria
                  - text: module and its
                  - code [ref=e6399]: criteria.md
