                      - cell "Similar instructions or duplicate facts conflict" [ref=e5400]
                      - cell "Consolidate each shared contract into one canonical copy and name artifacts clearly" [ref=e5401]
                    - row "Clash User, system, or stage instructions disagree Resolve conflicts before launching downstream stages" [ref=e5402]:
                      - cell "Clash" [ref=e5403]
