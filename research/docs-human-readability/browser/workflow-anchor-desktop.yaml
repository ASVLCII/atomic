                  - generic [ref=e5283]: "await ctx.task({"
                  - generic [ref=e5284]: "name: \"triage\","
                  - generic [ref=e5285]: "model: \"openai-codex/gpt-5.6-sol-fast:medium\","
                  - generic [ref=e5286]: "fallbackModels: [\"openai-codex/gpt-5.6-sol:medium\"],"
                  - generic [ref=e5287]: "prompt: \"…\","
                  - generic [ref=e5288]: "});"
              - generic [ref=e5289]:
                - text: There is no fast-mode setting, no scope inheritance, and no separate
                - code [ref=e5290]: fast
                - text: marker. Normal and fast IDs are distinct fallback candidates and distinct
                - code [ref=e5291]: modelAttempts
                - text: entries, and stage model metadata carries the exact selected ID, so a run’s records show precisely which one served each attempt. Graph node cards keep their dependency metadata focused on topology.
              - generic [ref=e5292]:
                - code [ref=e5293]: "workflow({ action: \"models\" })"
                - text: lists fast variants alongside their normal siblings, so a workflow can discover them at runtime. See
                - link "Providers" [ref=e5294] [cursor=pointer]:
                  - /url: /providers#fast-models
                - text: for which providers publish fast variants and what each one sends upstream.
              - generic [ref=e5295]: Pin fast variants deliberately in broad workflows. Parallel fan-out and fallback attempts multiply provider requests, and priority-tier requests are billed at a higher rate.
              - heading "Navigate to header Context Engineering" [level=2] [ref=e5296]:
                - link "Navigate to header" [ref=e5297] [cursor=pointer]:
                  - /url: "#context-engineering"
                  - img [ref=e5299]
                - generic [ref=e5302] [cursor=pointer]: Context Engineering
              - generic [ref=e5303]: A workflow is an information-flow system, not just a list of prompts. Most workflow failures come from missing, stale, oversized, or poorly-routed context. Design every stage boundary deliberately.
              - heading "Navigate to header Locally Scoped Stage Prompts" [level=3] [ref=e5304]:
                - link "Navigate to header" [ref=e5305] [cursor=pointer]:
                  - /url: "#locally-scoped-stage-prompts"
                  - img [ref=e5307]
                - generic [ref=e5310] [cursor=pointer]: Locally Scoped Stage Prompts
              - generic [ref=e5311]:
                - text: Stage prompts should define local contracts, not describe the full workflow runtime. Write prompts as if the stage could be executed independently from a fresh session with only the listed inputs. A useful compact shape is
                - code [ref=e5312]: Role · Goal · Success criteria · Constraints · Tools · Output · Stop rules
                - text: "; omit sections that do not change behavior. Include:"
              - list [ref=e5313]:
                - listitem [ref=e5314]: the stage’s current objective and what is out of scope for this stage
                - listitem [ref=e5315]: the exact files, artifacts, child outputs, or user inputs it may use; put long inputs before the final instruction
                - listitem [ref=e5316]: context-dependent tool routes and permission boundaries, without describing tools the stage cannot call
                - listitem [ref=e5317]: the expected output format and length, or the schema it must return when the workflow item is schema-enabled
                - listitem [ref=e5318]: the checks, tools, or deterministic commands it should run when relevant, plus evidence required for progress or completion claims
                - listitem [ref=e5319]: the success criteria and blocker conditions that let this stage stop
              - generic [ref=e5320]: State important constraints once. Reserve absolute wording for safety, required fields, forbidden actions, gating derivations, and other true invariants; express search, iteration, and delegation choices as decision rules. Ask for conclusions, commands, observed results, and citations—not private reasoning or generic self-verification.
              - generic [ref=e5321]: Avoid unrelated workflow internals such as reducer algorithms, future PR stages, sibling reviewer names, loop implementation details, or project-specific nicknames unless they are explicitly part of the current stage contract. If a term such as a gate name, ledger field, or workflow nickname is necessary, define it in the prompt before using it.
              - generic [ref=e5322]:
                - text: Choose context mode deliberately. Use
                - code [ref=e5323]: "context: \"fork\""
                - text: or
                - code [ref=e5324]: forkFromSessionFile
                - text: for coherent long-running implementation stages that need continuity from their own earlier work. Use
                - code [ref=e5325]: "context: \"fresh\""
                - text: for unbiased reviewer, evaluator, and gate stages so they inspect the current files and explicit artifacts rather than inheriting the implementer’s assumptions. When continuity is needed across fresh stages, pass it explicitly through files, declared outputs, and
                - code [ref=e5326]: reads
                - text: .
              - heading "Navigate to header Context-Mode-Aware Prompt Text" [level=3] [ref=e5327]:
                - link "Navigate to header" [ref=e5328] [cursor=pointer]:
                  - /url: "#context-mode-aware-prompt-text"
                  - img [ref=e5330]
                - generic [ref=e5333] [cursor=pointer]: Context-Mode-Aware Prompt Text
              - generic [ref=e5334]:
                - text: Context mode is an execution property configured with
                - code [ref=e5335]: context
                - text: /
                - code [ref=e5336]: forkFromSessionFile
                - text: "; the model cannot act on context mode, so keep it out of prompt text:"
              - list [ref=e5337]:
                - listitem [ref=e5338]:
                  - strong [ref=e5339]: Never describe the stage’s own context mode.
                  - text: Sentences like “you are running in a fresh context window”, “your context is clean/non-forked”, or “this is a forked session” add tokens without changing behavior. State the concrete action, inputs, and success criteria instead.
                - listitem [ref=e5340]:
                  - strong [ref=e5341]: Fresh stages must not reference invisible context.
                  - text: A fresh stage has no “previous conversation”, cannot see sibling stages, and does not know the surrounding graph, so instructions like “compare against previous workflow reasoning” or “this runs in parallel with the locator pass” do not help and may confuse the model. Phrase the same intent stage-locally (“compare the working tree against the baseline branch”; “do your own scan; do not assume any other stage’s output is available”) and pass any state the stage needs through files, declared outputs, and
                  - code [ref=e5342]: reads
                  - text: .
                - listitem [ref=e5343]:
                  - strong [ref=e5344]: Forked continuation prompts send only the delta.
                  - text: A forked stage already carries the role, contracts, guidance, and output format from its own earlier prompts, so repeating them uses more tokens and can make the two copies diverge. Send what changed since the fork point — new artifacts, updated state, the next action — plus a one-line pointer back (“the contracts and report format established earlier in this thread still apply unchanged”) instead of re-injecting the full text.
                - listitem [ref=e5345]:
                  - strong [ref=e5346]: Keep one canonical copy of shared contracts.
                  - text: When fresh and forked variants of a stage share guidance, render the full contract only in the prompt that first establishes it and reference it from continuations. If a continuation needs a contract restated (for example, after a schema change), that is a new contract version, not a repeat.
              - generic [ref=e5347]: "Long-running worker/reviewer workflows should follow this pattern: establish the complete contract once, then send forked continuation turns only the latest state and artifact paths with a pointer back to the established guidance."
              - heading "Navigate to header Context Fundamentals" [level=3] [ref=e5348]:
                - link "Navigate to header" [ref=e5349] [cursor=pointer]:
                  - /url: "#context-fundamentals"
                  - img [ref=e5351]
                - generic [ref=e5354] [cursor=pointer]: Context Fundamentals
              - generic [ref=e5355]: Treat context as a finite attention budget. Include only information needed for the current decision, place critical constraints near the beginning or end of prompts, and use progressive disclosure instead of loading every possible reference up front.
              - generic [ref=e5356]: "Common context sources:"
              - list [ref=e5357]:
                - listitem [ref=e5358]:
                  - strong [ref=e5359]: "System instructions:"
                  - text: persistent behavior and guardrails.
                - listitem [ref=e5360]:
                  - strong [ref=e5361]: "User inputs:"
                  - text: workflow inputs and human-in-the-loop decisions.
                - listitem [ref=e5362]:
                  - strong [ref=e5363]: "Retrieved documents:"
                  - text: files, search results, logs, API responses, and artifacts.
                - listitem [ref=e5364]:
                  - strong [ref=e5365]: "Message history:"
                  - text: useful for continuity, but grows quickly in long-running stages.
                - listitem [ref=e5366]:
                  - strong [ref=e5367]: "Tool outputs:"
                  - text: often the largest source of context bloat.
              - generic [ref=e5368]: For long workflows, assume effective model performance degrades before the advertised context limit. Keep high-signal summaries and artifact references close to the stage that needs them.
              - heading "Navigate to header Context Degradation Patterns" [level=3] [ref=e5369]:
                - link "Navigate to header" [ref=e5370] [cursor=pointer]:
                  - /url: "#context-degradation-patterns"
                  - img [ref=e5372]
                - generic [ref=e5375] [cursor=pointer]: Context Degradation Patterns
              - generic [ref=e5376]: "Watch for these failure modes in long or multi-stage workflows:"
