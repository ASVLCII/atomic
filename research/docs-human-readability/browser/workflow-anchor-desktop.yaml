                      - cell "Irrelevant context crowds out useful context" [ref=e5396]
                      - cell "Pass only stage-specific files and summaries" [ref=e5397]
                    - row "Confusion Similar instructions or duplicate facts conflict Consolidate each shared contract into one canonical copy and name artifacts clearly" [ref=e5398]:
