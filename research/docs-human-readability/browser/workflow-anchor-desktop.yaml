              - generic [ref=e4555]: "A workflow launches with a contract: the objective and, when supplied, explicit acceptance criteria. Two parties relate to it very differently:"
              - list [ref=e4556]:
                - listitem [ref=e4557]:
                  - strong [ref=e4558]: You may amend it at any time.
                  - text: A mid-run message — steering, a follow-up, resume text — is authoritative. If you say “also handle the detached path,” that is a new requirement, and the run adopts it from that moment.
                - listitem [ref=e4559]:
                  - strong [ref=e4560]: Agents may not amend it at all.
                  - text: An implementer that notices a nearby bug, a cleaner abstraction, or a missing feature has found
                  - emphasis [ref=e4561]: deferred work
                  - text: ", not a new criterion. It records the observation and keeps building to the contract."
