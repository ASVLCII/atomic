                      - cell "Lost in the middle" [ref=e5387]
                      - cell "Important constraints are ignored in long prompts" [ref=e5388]
                      - cell "Shorten the handoff; place documents first and the final query/critical contract last" [ref=e5389]
                    - row "Context poisoning Bad or obsolete information steers later stages Validate sources, overwrite stale artifacts, cite evidence" [ref=e5390]:
