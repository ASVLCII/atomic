                - generic [ref=e4568] [cursor=pointer]: Amendments must reach the next stage
              - generic [ref=e4569]: "An amendment that stays inside the session that received it is invisible to everything downstream. That produces the failure this rule exists to prevent:"
              - blockquote [ref=e4570]: You steer the implementation stage to add a requirement. The implementer adopts it and builds it. The reviewers were launched with the original criteria, so they score the added work as unrequested scope and the original criteria as contradicted. The run then burns review loops arguing about a contract mismatch nobody can see.
              - generic [ref=e4571]:
                - text: So every builtin stage prompt carries a
                - strong [ref=e4572]: steering propagation contract
                - text: ":"
              - list [ref=e4573]:
                - listitem [ref=e4574]:
                  - text: Restate every objective-relevant steering message in your report or handoff artifact, under an explicit
                  - code [ref=e4575]: Contract amendments received
                  - text: heading, verbatim when short.
                - listitem [ref=e4576]: Keep user-authored amendments visibly separate from your own observations, so the next stage can tell a required clause from an agent proposal.
                - listitem [ref=e4577]: Treat amendments inherited from an upstream stage as contract clauses. Cover them in acceptance and traceability work; never classify them as out-of-scope.
