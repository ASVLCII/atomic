                - generic [ref=e4879] [cursor=pointer]: Lifecycle, topology, and context rules
              - list [ref=e4880]:
                - listitem [ref=e4881]: Keep the graph acyclic. A boundary guard is an ordinary downstream reviewer node. Live Intercom steering is activity inside already-running parallel stages, not a new graph edge.
                - listitem [ref=e4882]: Never make a guard watch itself, recursively start another guard, reopen a terminal task, or add a dependency from the current frontier to an ancestor. Complete all turns on a retained guard before starting downstream dependency work.
                - listitem [ref=e4883]:
                  - text: Messages admitted before a worker generation closes drain through that stage boundary. Late messages do not reopen or mutate its terminal workflow state. Give each live branch a bounded stop rule;
                  - code [ref=e4884]: ctx.parallel(...)
                  - text: releases downstream work only after all started branches settle, even when one finishes first.
                - listitem [ref=e4885]: Persist decisions under stable keys. Pause/resume, model fallback, durable replay, and nested workflows then reread the artifact instead of sending duplicate interventions.
                - listitem [ref=e4886]:
                  - text: Omit
                  - code [ref=e4887]: group
                  - text: for ordinary use. The worker, guard, nested workflows, and delegated subagents inherit the top-level workflow invocation’s stable Intercom group. Set an explicit group only for intentional isolation; an override isolates that stage from ordinary same-group peers while leaving it steerable from the invocation context, which retains directional list/send/live-ask control over the subgroups it owns.
                - listitem [ref=e4888]:
                  - text: Use
                  - code [ref=e4889]: "context: \"fresh\""
                  - text: for guards, reviewers, and judges. They should see only the contract, candidate, decision artifacts, and current files.
                - listitem [ref=e4890]:
                  - text: Use
                  - code [ref=e4891]: "context: \"fork\""
                  - text: plus
                  - code [ref=e4892]: forkFromSessionFile
                  - text: for implementation, debugging, and repair roles that need continuity with an owned earlier session.
                  - code [ref=e4893]: "context: \"fork\""
                  - text: alone does not name a fork source; an initial worker with no prior lineage may start fresh. A later continuation should use the earlier worker’s
                  - code [ref=e4894]: sessionFile
                  - text: when available. Do not fork an independent guard from the worker it judges.
                - listitem [ref=e4895]: "Send a forked continuation only the delta after the fork point: new evidence, the decision artifact, any human answer, and the next action. Keep the full shared contract in its canonical file."
