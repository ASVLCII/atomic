              - generic [ref=e4611]: "The mirror of “only the user may amend” is that the agent holds the line. Every builtin implementation stage carries this contract:"
              - blockquote [ref=e4612]: Before writing code, state the goal in one sentence and list the acceptance criteria. That list is the contract. Freeze it.
              - generic [ref=e4613]: "While implementing:"
              - list [ref=e4614]:
                - listitem [ref=e4615]:
                  - strong [ref=e4616]: Done means the contract, not “good.”
                  - text: When all criteria pass, stop. Polish, refactors, and “while I’m here” fixes are new work, not this work.
                - listitem [ref=e4617]:
                  - strong [ref=e4618]: Every addition must trace to a criterion.
                  - text: If you cannot point at the criterion a change serves, do not make it. Log it instead.
                - listitem [ref=e4619]:
                  - strong [ref=e4620]: Keep a deferred list, not a growing diff.
                  - text: When you notice a bug, smell, or missing feature outside the contract, write one line in a deferred note and move on. Surface it at the end.
                - listitem [ref=e4621]:
                  - strong [ref=e4622]: Distinguish blockers from improvements.
                  - text: Change scope only if a criterion is impossible or wrong as written — and say so explicitly before proceeding, rather than silently absorbing the work.
                - listitem [ref=e4623]:
                  - strong [ref=e4624]: Watch for the tells.
                  - text: “It would be cleaner if…”, “we should also…”, “this really ought to…” mean you are about to move the goalpost. Stop and check the contract.
                - listitem [ref=e4625]:
                  - strong [ref=e4626]: Prefer the smallest diff that satisfies the contract.
                  - text: Fewer files touched, fewer abstractions introduced, no speculative generality for futures nobody asked for.
              - generic [ref=e4627]: "At the end, report three things: what the contract was, evidence each criterion passes, and the deferred list. Scope changes belong in the report, never in the diff."
