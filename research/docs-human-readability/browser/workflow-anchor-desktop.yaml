                - listitem [ref=e5530]: clean scratch files or keep them under run-specific directories
              - heading "Navigate to header Evaluation and Quality Gates" [level=3] [ref=e5531]:
                - link "Navigate to header" [ref=e5532] [cursor=pointer]:
                  - /url: "#evaluation-and-quality-gates"
                  - img [ref=e5534]
                - generic [ref=e5537] [cursor=pointer]: Evaluation and Quality Gates
              - generic [ref=e5538]: "Build validation into the workflow instead of waiting for a final manual check. Useful gates include:"
              - list [ref=e5539]:
                - listitem [ref=e5540]: "deterministic checks: tests, typechecks, linters, schema validation, command exit codes"
                - listitem [ref=e5541]: "rubric checks: completeness, correctness, evidence quality, risk coverage, user fit"
                - listitem [ref=e5542]: "reviewer stages: fresh-context reviewers that inspect artifacts and current files"
                - listitem [ref=e5543]: "LLM-as-judge stages: direct scoring, pairwise comparison, or rubric-based grading for subjective outputs"
              - generic [ref=e5544]:
                - text: Use
                - code [ref=e5545]: schema
                - text: for review and gate decisions. Object schemas with explicit decisions, findings, confidence, and evidence are usually easiest to consume; arrays and primitives also work. Read
                - code [ref=e5546]: result.structured
                - text: rather than matching prose such as “approved” with a regular expression. Define each convergence field once and consume it deterministically.
              - generic [ref=e5547]:
                - text: Use small dedicated model stages for adaptive gates when deterministic code alone cannot decide what to check. For example, a stage can read an artifact, inspect the repo, run a named tool or command, and then emit a structured decision by configuring
                - code [ref=e5548]: schema
                - text: "on that workflow item. Keep that stage’s prompt narrow: tell it the specific check to perform, the files/tools it may use, the evidence to report, and the structured decision it must return. Require progress and completion claims to map to current tool results; when evidence is unavailable, the stage should identify the unverified claim or blocker rather than infer success."
              - generic [ref=e5549]: When using LLM judges, reduce bias by defining score anchors, requesting observable evidence and criteria-based justification, calibrating against examples, and keeping length/order effects in mind. Do not ask for chain-of-thought or reconstructed internal reasoning. Track pass rates and failures over time for reusable workflows.
              - heading "Navigate to header Tools, MCP, Memory, and Hosted Execution" [level=3] [ref=e5550]:
                - link "Navigate to header" [ref=e5551] [cursor=pointer]:
                  - /url: "#tools-mcp-memory-and-hosted-execution"
                  - img [ref=e5553]
                - generic [ref=e5556] [cursor=pointer]: Tools, MCP, Memory, and Hosted Execution
              - generic [ref=e5557]: Constrain each stage to the tools it needs. Too many tools increase ambiguity and token cost; too few tools force brittle workarounds. Tool descriptions should make inputs, side effects, and error handling clear.
              - generic [ref=e5558]:
                - text: Use per-stage
                - code [ref=e5559]: mcp
                - text: allow/deny lists when a workflow needs external systems but some stages should remain read-only or isolated. Use memory or durable project knowledge only when cross-run continuity is required; otherwise prefer explicit inputs and artifacts.
              - generic [ref=e5560]: "Hosted or remote agent workflows need additional design work: sandbox setup, dependency caching, auth boundaries, artifact transfer, concurrency limits, and multiplayer/session handoff behavior. Optimize startup before the user begins the run; do not make each stage rebuild its environment."
              - heading "Navigate to header Task Fit and Project Design" [level=3] [ref=e5561]:
