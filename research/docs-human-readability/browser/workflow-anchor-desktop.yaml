              - generic [ref=e5518]: "Recommended patterns:"
              - list [ref=e5519]:
                - listitem [ref=e5520]: write large tool outputs to files and return concise references
                - listitem [ref=e5521]: store plans, state, and reviewer findings in structured markdown or JSON
                - listitem [ref=e5522]:
                  - text: pass artifact paths via
