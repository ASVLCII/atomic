                - listitem [ref=e3522]: A stage pause cancels that generation’s owned task executions, not its queued messages or future workflow stages. User and Intercom messages remain held until resume; resume allows fresh tasks and never restarts the cancelled executions. Cancellation and cleanup failures reject the pause rather than reporting a successful stop.
                - listitem [ref=e3523]: A whole-run executor-only pause also holds already-live owned child workflows, including children with no tracked node yet. Resume persists the root’s running transition before releasing those child executors; a child-scoped control leaves sibling workflows alone.
                - listitem [ref=e3524]: "Live executor resume does not require a checkpoint. Cross-process resume still requires durable checkpoint or pending-prompt progress: losing a zero-progress live owner cannot reconstruct its JavaScript continuation. Cancelling the original startup request before acknowledgement remains terminal cancellation, not this live pause."
