                - code [ref=e4160]: /resume
                - text: "retention semantics: eligible runs remain searchable regardless of age or count. Aged-out history is driven by the state-aware"
                - code [ref=e4161]: WORKFLOW_ARTIFACT_RETENTION_MS
                - text: "policy: only terminal or unowned directories older than the policy are pruned, and pruning deletes the durable entry first, removing the artifact directory only when that deletion succeeds — a refused or unavailable deletion preserves both. Running, paused, quit, blocked, and awaiting-input runs retain their artifacts and durable records so they remain resumable. The picker mounts before asynchronous catalog hydration completes and merges DBOS rows when ready."
