              - generic [ref=e3705]:
                - text: Atomic emits deduplicated main-chat notices when top-level workflow runs complete, fail, end blocked, or stop at an active recoverable provider/auth/rate-limit block. A recoverable block remains resumable (
                - code [ref=e3706]: status
