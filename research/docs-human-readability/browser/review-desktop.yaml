              - generic [ref=e2733]:
                - text: Send material updates through Intercom to every affected workflow stage, including stages that have not started. Name and pattern sends remain sticky for every future matching stage until root termination. When shared scope or acceptance criteria change, broadcast one authoritative update to
                - code [ref=e2734]: workflow:<rootRunId>/**
                - text: (or a narrower path pattern) rather than enumerating stages; live matches receive it immediately and future descendants receive it before their first model turn. A syntactically valid path outside the persisted known set queues with a
                - code [ref=e2735]: notInKnownSet
                - text: warning and settles undeliverable at terminal only if never delivered; an entry delivered at least once is not reported undeliverable. Use
                - code [ref=e2736]: ask
                - text: once the stage session is live and can reply.
