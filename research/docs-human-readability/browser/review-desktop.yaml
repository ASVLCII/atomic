                - generic [ref=e2663] [cursor=pointer]: Workflow Operations
              - generic [ref=e2664]: "Run and operate workflows from interactive chat or the workflow tool: identify runs, inspect their graphs, communicate with stages, answer human-input gates, and manage durable execution."
              - heading "Navigate to header Automatic stage models" [level=2] [ref=e2665]:
                - link "Navigate to header" [ref=e2666] [cursor=pointer]:
                  - /url: "#automatic-stage-models"
                  - img [ref=e2668]
                - generic [ref=e2671] [cursor=pointer]: Automatic stage models
              - generic [ref=e2672]:
                - text: For stages authored with
                - code [ref=e2673]: "model: \"auto\""
                - text: ", Atomic makes one bounded decision before starting the execution session. The selected model/effort is retained as"
                - code [ref=e2674]: routerSelection
                - text: ", independently of the actual"
                - code [ref=e2675]: model
                - text: ","
                - code [ref=e2676]: thinkingLevel
                - text: ", and fallback attempts. Unsuffixed fallbacks inherit the selected effort; explicit fallback suffixes retain their own effort. Every automatic fallback must satisfy the stage’s hard constraints."
              - generic [ref=e2677]: Model selection uses the actual stage prompt, stage name, hard constraints, available model catalog, and shipped evaluation guides. Stage system and appended system prompts are not sent to the model router. Put requirements that should influence model selection in the stage prompt; the execution session still receives its configured system prompts.
              - generic [ref=e2678]:
                - text: Malformed or schema-invalid routing answers receive up to three repair retries after the initial attempt, within one shared 30-second deadline. Missing guides, an empty eligible catalog, stale decisions, credential-bearing routing context, authentication/provider errors, timeout, and cancellation prevent stage execution without repair. If repairs are exhausted, no stage starts. Correct the issue and retry explicitly; Atomic never silently selects the current chat model. Choose a
                - code [ref=e2679]: routerModel
                - text: provider permitted to receive the task and supplied context. Parent chat and sibling settings are unchanged.
              - generic [ref=e2680]:
                - text: Replay reuses recorded results without routing. Resume of a saved auto stage retains its verified selection and revalidates it against the current catalog and restrictions before fresh session admission, without a hidden new decision. If it is no longer eligible, resume fails rather than choosing another model. See
                - link "authoring automatic stages" [ref=e2681] [cursor=pointer]:
                  - /url: /workflows/authoring#automatic-stage-model-selection
                - text: .
              - heading "Navigate to header Workflow run identifiers and the BACKGROUND panel" [level=2] [ref=e2682]:
                - link "Navigate to header" [ref=e2683] [cursor=pointer]:
                  - /url: "#workflow-run-identifiers-and-the-background-panel"
                  - img [ref=e2685]
                - generic [ref=e2688] [cursor=pointer]: Workflow run identifiers and the BACKGROUND panel
              - generic [ref=e2689]:
                - text: Workflow run identifiers are shown in full in status views, pickers, control messages, and the
                - code [ref=e2690]: BACKGROUND
                - text: panel. Selectors accept either the full 36-character UUID or its unique 8-character hexadecimal prefix. Other truncated forms are rejected. Colliding prefixes report the matching full UUIDs and require a full UUID; resolved results retain canonical identifiers.
              - generic [ref=e2691]:
                - text: Stage selectors preserve exact stage IDs and names, composite
                - code [ref=e2692]: runId:stageId
                - text: IDs, and
                - code [ref=e2693]: tool:<argsHash>
                - text: IDs. Bare UUID stage IDs additionally accept a unique 8-character hexadecimal prefix across the expanded graph. Exact names take precedence. Partial names and truncated composite/tool IDs do not match; colliding UUID prefixes require the full stage UUID.
              - heading "Navigate to header Intercom delivery to pending workflow stages" [level=3] [ref=e2694]:
                - link "Navigate to header" [ref=e2695] [cursor=pointer]:
                  - /url: "#intercom-delivery-to-pending-workflow-stages"
