              - generic [ref=e2744]:
                - text: At 80 columns and wider, each
                - code [ref=e2745]: BACKGROUND
                - text: card shows the full run identity, mode, progress, live-tool details, and elapsed/status metadata. Remaining row space may show pending stages. Each target appears exactly or is replaced by a
                - code [ref=e2746]: stage
                - text: "-labeled canonical ID;"
                - code [ref=e2747]: … N more
                - text: counts omitted stages. If neither form fits, the pending label is omitted rather than displacing existing metadata. Tool nodes are read-only durable graph nodes, not attachable stage chats.
              - generic [ref=e2748]:
                - text: The widget uses at most
                - strong [ref=e2749]: 10 rows
                - text: ", including its final scroll hint, and at most one third of the terminal height, rounded down with a one-row minimum. Scrolling over it moves only its list, even at either end. Scrolling outside it retains normal transcript behavior. A slim scrollbar appears only when the allocated area overflows; there is no numeric row-range counter. Every row stays reachable even when a multiline draft leaves only one widget row."
              - generic [ref=e2750]:
                - text: From the main editor, use
                - strong [ref=e2751]: Alt+K
