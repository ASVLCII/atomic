                - text: . Resolve material ambiguity from objective and repository evidence. A
                - code [ref=e3711]: budget_exceeded
                - text: "stop remains an authorization boundary: summarize progress and ask before raising the budget; do not evade the chosen limit by changing execution mode."
              - generic [ref=e3712]: Lifecycle notices appear once in main chat without interrupting current streaming text. Atomic also queues a model update so later responses can correct stale progress claims. Notices waiting for delivery survive recoverable delivery failures; session replacement does not send them to an unrelated chat.
