                - generic [ref=e2700] [cursor=pointer]: Intercom delivery to pending workflow stages
              - generic [ref=e2701]:
                - text: A workflow stage uses the root-anchored
                - code [ref=e2702]: workflow:<rootRunId>/<segment>[/<segment>...]
                - text: path shown by
                - code [ref=e2703]: intercom list
                - text: "and workflow status surfaces. A segment may be a stage name, a materialized run id, or a glob:"
                - code [ref=e2704]: "*"
                - text: matches one segment and may be embedded, while
                - code [ref=e2705]: "**"
                - text: matches any depth. Model-facing
                - code [ref=e2706]: workflow status
                - text: and interactive status list/detail surfaces enumerate materialized pending stages by display name and canonical stage ID, printing the path only when
                - code [ref=e2707]: pendingStageDeliveryAvailable
                - text: is true and the owning run is nonterminal. An ended root or nested child never advertises a retained pending target. Duplicate names remain independently identifiable. The workflow SDK
                - code [ref=e2708]: sessionId
                - text: is
                - strong [ref=e2709]: not
                - text: an Intercom target.
              - generic [ref=e2710]:
                - text: Join
                - code [ref=e2711]: workflow:<rootRunId>
                - text: and run
                - code [ref=e2712]: "intercom({ action: \"list\" })"
                - text: to see live sessions, materialized
                - code [ref=e2713]: PENDING
                - text: /
                - code [ref=e2714]: RUNNING
                - text: "stages, and possible future literal, glob, and nested-child targets with queued counts. Then use ordinary Intercom delivery:"
              - generic [ref=e2715]:
