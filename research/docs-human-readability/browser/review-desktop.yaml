                - text: remain aliases. Configured editor bindings always win, including Vim-style Alt+J/K cursor bindings; Alt+Up still restores queued messages. Scrolling never takes focus from the editor. Customize
                - code [ref=e2755]: app.workflows.scrollUp
                - text: and
                - code [ref=e2756]: app.workflows.scrollDown
                - text: in
                - link "keybindings.json" [ref=e2757] [cursor=pointer]:
                  - /url: /keybindings#workflow-widget-scrolling
                - text: ; arrays replace defaults, and
                - code [ref=e2758]: "[]"
                - text: disables an action. The list’s final hint shows available bindings.
